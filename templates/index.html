<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* STYLE BARU BUAT PILIHAN KUALITAS */
    .quality-wrap{
      margin-top:12px;
      text-align:left;
    }
    .quality-wrap label{
      font-size:13px;
      font-weight:bold;
      color:#333;
      margin-left:4px;
    }
    #quality{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:2px solid #e0e0e0;
      background:white;
      font-weight:bold;
      font-size:15px;
      text-align:center;
      margin-top:6px;
      outline:none;
      cursor:pointer;
    }
    #quality:focus{
      border-color:#3b82f6;
    }
    .quality-note{
      font-size:11px;
      color:#666;
      text-align:center;
      margin-top:6px;
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-gradient"></div>

  <div class="topbar">
    <div class="logo">💥 Sosial Media Downloader</div>
    <div class="badge-id">ID 🇮🇩</div>
  </div>

  <div class="container">
    <p class="sub">TikTok ✅ Instagram ✅ Facebook ✅</p>
    <div class="box">
      <div class="input-row">
        <input id="url" placeholder="Masukkan Link disini...">
        <button class="btn-paste" onclick="pasteLink()" title="Paste Link">📋</button>
      </div>

      <!-- === PILIHAN KUALITAS === -->
      <div class="quality-wrap">
        <label for="quality">🎞️ Pilih Kualitas Video :</label>
        <select id="quality">
          <option value="360">360p - Hemat Kuota 📱</option>
          <option value="480">480p - Standar</option>
          <option value="720" selected>720p - HD (Rekomendasi) ✨</option>
          <option value="1080">1080p - Full HD 🔥</option>
          <option value="best">Kualitas Terbaik 🚀</option>
        </select>
        <div class="quality-note">• TikTok Cuma ada 1 kualitas, jadi pilihan ini khusus IG / FB •</div>
      </div>

      <button class="btn-utama" onclick="cek()">Download Video MP4/MP3</button>
      <div id="hasil"></div>
    </div>
  </div>

  <footer>Created By: <b>@idgarsell</b> ✨</footer>

<script>
  async function pasteLink(){
    try{
      const text = await navigator.clipboard.readText();
      if(text){ document.getElementById('url').value = text; cek(); }
      else { alert('Copy dulu link-nya'); }
    }catch(e){ alert('izin clipboard belum dikasih, paste manual Aja'); }
  }

  async function cek(){
    let url = document.getElementById('url').value;
    if(url.includes('youtube.com') || url.includes('youtu.be')){
      return document.getElementById('hasil').innerHTML = '<p style="color:orange">⚠️ YouTube udah dihapus, soalnya sering kena blok. Pake TikTok / IG / FB aja ya!</p>';
    }
    document.getElementById('hasil').innerHTML = '<p>⏳ Harap Tunggu Bentar... 🚀</p>';
    let r = await fetch('/info', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url})});
    let d = await r.json();
    if(d.error) return document.getElementById('hasil').innerHTML = '<p style="color:red">'+d.error+'</p>';
    let player = '';
    if(d.video_url){
      player = `<div class="video-wrap"><video id="vid" controls loop playsinline preload="metadata" src="${d.video_url}" poster="${d.thumbnail}"></video></div>`;
    } else {
      player = `<img src="${d.thumbnail}">`;
    }
    document.getElementById('hasil').innerHTML = player + `<h3>${d.title}</h3><p>${d.uploader}</p><button class="green" onclick="dl(false)">VIDEO </button><button onclick="dl(true)"> MP3</button>`;
    let v = document.getElementById('vid');
    if(v){ v.loop = true; v.muted = false; v.volume = 1; v.currentTime = 0; v.pause(); }
  }

  async function dl(audio){
    let url = document.getElementById('url').value;
    // === AMBIL KUALITAS DARI DROPDOWN ===
    let quality = document.getElementById('quality').value;
    // Kalo MP3, kualitas gak dipake, tapi tetep dikirim biar aman
    document.getElementById('hasil').innerHTML += '<p>⏳ Sedang Download Harap Tunggu... 🚀</p>';
    let r = await fetch('/download', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url, audio, quality})});
    let d = await r.json();
    if(d.error) return alert(d.error);
    if(d.note) alert(d.note);
    window.location.href = d.file;
  }

  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let dots = [];
  function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  for(let i = 0; i < 60; i++){
    dots.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: Math.random() * 2 + 1 });
  }
  function gambar(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(let i = 0; i < dots.length; i++){
      for(let j = i + 1; j < dots.length; j++){
        let dx = dots[i].x - dots[j].x; let dy = dots[i].y - dots[j].y; let jarak = Math.sqrt(dx*dx + dy*dy);
        if(jarak < 130){ ctx.strokeStyle = `rgba(255,255,255,${(1 - jarak/130) * 0.25})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke(); }
      }
    }
    for(let d of dots){ ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); d.x += d.vx; d.y += d.vy; if(d.x < 0 || d.x > canvas.width) d.vx *= -1; if(d.y < 0 || d.y > canvas.height) d.vy *= -1; }
    requestAnimationFrame(gambar);
  }
  gambar();
</script>
</body>
</html>
